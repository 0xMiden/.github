name: Docker Build Check

on:
  workflow_call:
    inputs:
      component:
        description: 'The component to build a Docker image for'
        required: true
        type: string

      dockerfile_path:
        description: 'The Dockerfile path for the component'
        required: false
        type: string
        default: 'Dockerfile'

permissions:
  contents: read
  id-token: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Build ${{ inputs.component }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: github.event.pull_request.head.repo.fork == false
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: GithubActionsSession

      - name: Set cache parameters
        if: github.event.pull_request.head.repo.fork == false
        run: |
          echo "CACHE_FROM=type=s3,region=${{ secrets.AWS_REGION }},bucket=${{ secrets.AWS_CACHE_BUCKET }},name=miden-${{ inputs.component }}" >> $GITHUB_ENV
          echo "CACHE_TO=type=s3,region=${{ secrets.AWS_REGION }},bucket=${{ secrets.AWS_CACHE_BUCKET }},name=miden-${{ inputs.component }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: true

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          push: false
          file: ${{ inputs.dockerfile_path }}
          cache-from: ${{ env.CACHE_FROM || '' }}
          cache-to: ${{ env.CACHE_TO || '' }}
