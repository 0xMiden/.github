name: Docker Build Check

on:
  workflow_call:
    inputs:
      component:
        description: 'The component to build a Docker image for'
        required: true
        type: string

      dockerfile_path:
        description: 'The Dockerfile path for the component'
        required: false
        type: string
        default: 'Dockerfile'

    secrets:
      gh_token:
        description: 'Github token'
        required: true

      aws_region:
        description: 'AWS region'
        required: false

      aws_role:
        description: 'AWS role'
        required: false

      aws_cache_bucket:
        description: 'AWS cache bucket'
        required: false

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Build ${{ inputs.component }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: github.event.pull_request.head.repo.fork == false && secrets.aws_region != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.aws_region }}
          role-to-assume: ${{ secrets.aws_role }}
          role-session-name: GithubActionsSession

      - name: Set cache parameters
        if: github.event.pull_request.head.repo.fork == false && secrets.aws_region != ''
        run: |
          echo "CACHE_FROM=type=s3,region=${{ secrets.aws_region }},bucket=${{ secrets.aws_cache_bucket }},name=miden-${{ inputs.component }}" >> $GITHUB_ENV
          echo "CACHE_TO=type=s3,region=${{ secrets.aws_region }},bucket=${{ secrets.aws_cache_bucket }},name=miden-${{ inputs.component }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: true

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          push: false
          file: ${{ inputs.dockerfile_path }}
          cache-from: ${{ env.CACHE_FROM || '' }}
          cache-to: ${{ env.CACHE_TO || '' }}
