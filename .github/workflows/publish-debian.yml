name: Publish Debian Package

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Name of service to publish"
        required: true
        type: string
      crate_dir:
        required: true
        description: "Name of crate directory"
        type: string
      package:
        required: true
        description: "Name of packaging directory"
        type: string
      crate:
        description: "Name of the binary crate to publish"
        required: true
        type: string
      version:
        description: "Version to release (E.G. v0.10.0-rc.1, v0.10.0). Corresponding git tag must already exist."
        required: true
        type: string
  workflow_call:
    inputs:
      service:
        description: "Name of service to publish"
        required: true
        type: string
      crate_dir:
        required: true
        description: "Name of crate directory"
        type: string
      package:
        required: true
        description: "Name of packaging directory"
        type: string
      crate:
        description: "Name of the binary crate to publish"
        required: true
        type: string
      version:
        description: "Version to release (E.G. v0.10.0-rc.1, v0.10.0). Corresponding git tag must already exist."
        required: true
        type: string

    secrets:
      gh_token:
        description: 'Github token'
        required: true

# Default the token to no scopes; the publishing job opts into release-asset upload scope.
permissions: {}

jobs:
  publish:
    name: Publish ${{ matrix.arch }} Debian
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on:
      labels: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and Publish Packages
        uses: ./.github/actions/debian
        with:
          github_token: ${{ secrets.gh_token }}
          gitref: ${{ inputs.version }}
          crate_dir: ${{ inputs.crate_dir }}
          service: ${{ inputs.service }}
          package: ${{ inputs.package }}
          crate: ${{ inputs.crate }}
          arch: ${{ matrix.arch }}
