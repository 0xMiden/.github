name: Release-plz (dry-run)

on:
  workflow_call:
    inputs:
      release_config:
        description: 'The path to release-plz config'
        required: false
        type: string
        default: 'configs/.release-plz.toml'

    secrets:
      gh_token:
        description: 'Github token'
        required: true

      cargo_registry_token:
        description: 'Cargo registry token'
        required: true

# Default the token to no scopes; the dry run only opts into repository read access.
permissions: {}

jobs:
  release-plz-dry-run-release:
    name: Release-plz dry-run
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == '0xMiden' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Update Rust toolchain
        run: |
          rustup update --no-self-update
      - name: Run release-plz
        uses: release-plz/action@1528104d2ca23787631a1c1f022abb64b34c1e11 # v0.5
        with:
          command: release --dry-run
          config: ${{ inputs.release_config }}
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.cargo_registry_token }}
