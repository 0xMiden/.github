name: Release-plz (dry-run)

on:
  workflow_call:
    inputs:
      release_config:
        description: 'The path to release-plz config'
        required: false
        type: string
        default: 'configs/.release-plz.toml'

    secrets:
      gh_token:
        description: 'Github token'
        required: true

      cargo_registry_token:
        description: 'Cargo registry token'
        required: true


jobs:
  release-plz-dry-run-release:
    name: Release-plz dry-run
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == '0xMiden' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Rust toolchain
        run: |
          rustup update --no-self-update
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release --dry-run
          config: ${{ inputs.release_config }}
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.cargo_registry_token }}
