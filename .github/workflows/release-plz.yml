name: Release-plz (main)

on:
  workflow_call:
    inputs:
      release_config:
        description: 'The path to release-plz config'
        required: false
        type: string
        default: 'configs/.release-plz.toml'

    secrets:
      gh_token:
        description: 'Github token'
        required: true

      cargo_registry_token:
        description: 'Cargo registry token'
        required: true

# Default the token to no scopes; the release job opts into publication scopes below.
permissions: {}

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == '0xMiden' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      # Ensure the release tag refers to the latest commit on target ref.
      # Compare the commit SHA that triggered the workflow with the HEAD of the branch we just
      # checked out (main).
      - name: Verify release was triggered from the target ref HEAD
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          tag_sha="$TRIGGER_SHA"
          main_sha="$(git rev-parse HEAD)"

          echo "Tag points to:        $tag_sha"
          echo "Current main HEAD is: $main_sha"

          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::error::The release tag was not created from the latest commit on the target ref. Aborting."
            exit 1
          fi
          echo "Release tag matches the target ref HEAD — continuing."
      - name: Update Rust toolchain
        run: |
          rustup update --no-self-update
      - name: Run release-plz
        uses: release-plz/action@1528104d2ca23787631a1c1f022abb64b34c1e11 # v0.5
        with:
          command: release
          config: ${{ inputs.release_config }}
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.cargo_registry_token }}
