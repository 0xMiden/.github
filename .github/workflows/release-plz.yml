name: Release-plz (main)

on:
  workflow_call:
    inputs:
      release_config:
        description: 'The path to release-plz config'
        required: false
        type: string
        default: 'configs/.release-plz.toml'
      
      target_ref:
        description: 'The git ref to release from'
        required: false
        type: string
        default: 'main'

    secrets:
      gh_token:
        description: 'Github token'
        required: true
        type: string

      cargo_registry_token:
        description: 'Cargo registry token'
        required: true
        type: string

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    # if: ${{ github.repository_owner == '0xMiden' }} TODO(Maks) uncomment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}
      # Ensure the release tag refers to the latest commit on target ref.
      # Compare the commit SHA that triggered the workflow with the HEAD of the branch we just
      # checked out (main).
      - name: Verify release was triggered from main HEAD
        run: |
          tag_sha="${{ github.sha }}"
          main_sha="$(git rev-parse HEAD)"

          echo "Tag points to:        $tag_sha"
          echo "Current main HEAD is: $main_sha"

          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::error::The release tag was not created from the latest commit on main. Aborting."
            exit 1
          fi
          echo "Release tag matches main HEAD — continuing."
      - name: Update Rust toolchain
        run: |
          rustup update --no-self-update
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          config: ${{ inputs.release_config }}
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.cargo_registry_token }}
