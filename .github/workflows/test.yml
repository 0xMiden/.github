# Runs testing related jobs.

name: test

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'The branch to cache Rust compilation artifacts from'
        required: false
        type: string
        default: 'next'

# Default the token to no scopes; test jobs only need read access for checkout.
permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Rustup
        run: rustup update --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.target_branch) }}
      - uses: taiki-e/install-action@0dacf2f51ba412930ad0bbe41b20711980f5fe0f # nextest
      - name: Run tests
        run: make test

  doc-test:
    name: Documentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Rustup
        run: rustup update --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.target_branch) }}
      - name: Run doc tests
        run: make doc-test
