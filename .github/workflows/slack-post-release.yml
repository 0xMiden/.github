# Posts release notes to Slack.
#
# Caller responsibilities:
# - Trigger the caller workflow on `release` with `types: [published]`.
# - Pass release title, URL, and release notes as inputs.
# - Pass `slack_webhook_url` from an organization or repository secret.

name: Slack post release

on:
  workflow_call:
    inputs:
      title:
        description: "Slack message title"
        required: true
        type: string
      release_notes:
        description: "Release notes text to post or summarize"
        required: false
        type: string
        default: ""
      release_url:
        description: "Release URL"
        required: true
        type: string

    secrets:
      slack_webhook_url:
        description: "Slack incoming webhook URL"
        required: true

permissions: {}

jobs:
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Validate inputs
        shell: bash
        env:
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_URL: ${{ inputs.release_url }}
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
        run: |
          set -euo pipefail

          require_non_empty() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "::error::$name is required."
              exit 1
            fi
          }

          require_non_empty "title" "$RELEASE_TITLE"
          require_non_empty "release_url" "$RELEASE_URL"
          require_non_empty "slack_webhook_url" "$SLACK_WEBHOOK_URL"

          if [[ ! "$RELEASE_URL" =~ ^https://github\.com/[^[:space:]]+$ ]]; then
            echo "::error::release_url must be an https://github.com URL."
            exit 1
          fi

          if [[ ! "$SLACK_WEBHOOK_URL" =~ ^https://hooks\.slack\.com/services/[^[:space:]]+$ ]]; then
            echo "::error::slack_webhook_url must be a Slack incoming webhook URL."
            exit 1
          fi

      - name: Summarize release notes
        id: summarize
        shell: bash
        run: |
          {
            echo "summary<<EOF"
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Slack message format:
      # 
      # [title](release_url)
      #
      # summary
      - name: Build Slack payload
        id: build_payload
        shell: bash
        env:
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_URL: ${{ inputs.release_url }}
          RELEASE_SUMMARY: ${{ steps.summarize.outputs.summary }}
        run: |
          set -euo pipefail

          payload_path="${RUNNER_TEMP:-/tmp}/slack-post-release-payload.json"
          mkdir -p "$(dirname "$payload_path")"

          jq -n \
            --arg title "$RELEASE_TITLE" \
            --arg release_url "$RELEASE_URL" \
            --arg summary "$RELEASE_SUMMARY" \
            '
              def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
              def trim: gsub("^[[:space:]]+|[[:space:]]+$"; "");
              def truncate($n): if length > $n then .[0:($n - 3)] + "..." else . end;

              ($summary | trim) as $clean_summary |
              {
                text: "\($title): \(if $clean_summary == "" then "Summary not available yet" else $clean_summary end)",
                unfurl_links: false,
                unfurl_media: false,
                blocks: [
                  {
                    type: "section",
                    text: {
                      type: "mrkdwn",
                      text: "*<\($release_url)|\($title | esc)>*"
                    }
                  },
                  {
                    type: "section",
                    text: {
                      type: "mrkdwn",
                      text: (if $clean_summary == "" then "Summary not available yet" else ($clean_summary | esc) end | truncate(1800))
                    }
                  }
                ]
              }
            ' > "$payload_path"

          echo "payload_path=$payload_path" >> "$GITHUB_OUTPUT"

      - name: Post Slack notification
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
          SLACK_PAYLOAD_PATH: ${{ steps.build_payload.outputs.payload_path }}
        run: |
          set -euo pipefail

          if [ -z "$SLACK_PAYLOAD_PATH" ]; then
            echo "::error::Slack payload path was not provided."
            exit 1
          fi

          if [ ! -f "$SLACK_PAYLOAD_PATH" ]; then
            echo "::error::Slack payload file does not exist: $SLACK_PAYLOAD_PATH"
            exit 1
          fi

          response_file="${RUNNER_TEMP:-/tmp}/slack-post-release-response.txt"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary "@${SLACK_PAYLOAD_PATH}" \
            --output "$response_file" \
            "$SLACK_WEBHOOK_URL"

          if [ "$(tr -d '\r\n' < "$response_file")" != "ok" ]; then
            echo "::error::Slack webhook returned an unexpected response:"
            cat "$response_file"
            exit 1
          fi

      - name: Write workflow summary
        shell: bash
        env:
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_URL: ${{ inputs.release_url }}
          RELEASE_SUMMARY: ${{ steps.summarize.outputs.summary }}
          SLACK_PAYLOAD_PATH: ${{ steps.build_payload.outputs.payload_path }}
        run: |
          set -euo pipefail

          if [ -z "${GITHUB_STEP_SUMMARY:-}" ]; then
            exit 0
          fi

          {
            echo "## Slack Post Release"
            echo
            echo "- Title: [${RELEASE_TITLE}](${RELEASE_URL})"
            echo "- Payload: \`${SLACK_PAYLOAD_PATH:-not available}\`"
            if [ -n "$RELEASE_SUMMARY" ]; then
              echo
              echo "### Summary"
              echo
              echo "$RELEASE_SUMMARY"
            else
              echo "- Summary: empty"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
