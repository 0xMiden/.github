# Posts release notes to Slack.
#
# Caller responsibilities:
# - Trigger the caller workflow on `release` with `types: [published]`.
# - Grant `models: read`.
# - Pass release title, URL, and release notes as inputs.
# - Set `RELEASE_SUMMARY_SLACK_CHANNEL_ID` as an organization or repository variable.
# - Pass `slack_bot_token` from an organization or repository secret.

name: Slack post release

on:
  workflow_call:
    inputs:
      title:
        description: "Slack message title"
        required: true
        type: string
      release_notes:
        description: "Release notes text to post or summarize"
        required: false
        type: string
        default: ""
      release_url:
        description: "Release URL"
        required: true
        type: string
      model:
        description: "GitHub Models model used to summarize the release notes"
        required: false
        type: string
        default: "openai/gpt-4o"

    secrets:
      slack_bot_token:
        description: "Slack bot token"
        required: true

permissions: {}

jobs:
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      models: read

    steps:
      - name: Validate inputs
        shell: bash
        env:
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_URL: ${{ inputs.release_url }}
          SLACK_CHANNEL_ID: ${{ vars.RELEASE_SUMMARY_SLACK_CHANNEL_ID }}
          MODEL: ${{ inputs.model }}
          SLACK_BOT_TOKEN: ${{ secrets.slack_bot_token }}
        run: |
          set -euo pipefail

          require_non_empty() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "::error::$name is required."
              exit 1
            fi
          }

          require_non_empty "title" "$RELEASE_TITLE"
          require_non_empty "release_url" "$RELEASE_URL"
          require_non_empty "RELEASE_SUMMARY_SLACK_CHANNEL_ID" "$SLACK_CHANNEL_ID"
          require_non_empty "model" "$MODEL"
          require_non_empty "slack_bot_token" "$SLACK_BOT_TOKEN"

          if [[ ! "$RELEASE_URL" =~ ^https://github\.com/[^[:space:]]+$ ]]; then
            echo "::error::release_url must be an https://github.com URL."
            exit 1
          fi

          if [[ ! "$SLACK_CHANNEL_ID" =~ ^[CGD][A-Z0-9]+$ ]]; then
            echo "::error::RELEASE_SUMMARY_SLACK_CHANNEL_ID must be a Slack channel or conversation ID."
            exit 1
          fi

      - name: Summarize release notes
        id: summarize
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_NOTES" ]; then
            summary="Release notes were not provided."
          else
            response="$(
              jq -n \
                --arg model "$MODEL" \
                --arg notes "$RELEASE_NOTES" \
                '{
                  model: $model,
                  temperature: 0.2,
                  messages: [
                    {
                      role: "system",
                      content: "Summarize release notes for a Slack release announcement. Return one short paragraph of at most 80 words. Do not use bullet points, headings, markdown tables, or hype."
                    },
                    {
                      role: "user",
                      content: $notes
                    }
                  ]
                }' |
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Content-Type: application/json" \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary @- \
                "https://models.github.ai/inference/chat/completions"
            )"

            summary="$(jq -r '.choices[0].message.content // ""' <<< "$response")"
            if [ -z "$summary" ]; then
              echo "::error::GitHub Models response did not include a summary."
              exit 1
            fi
          fi

          delimiter="SUMMARY_${RANDOM}_${RANDOM}"
          {
            echo "summary<<${delimiter}"
            echo "$summary"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # Slack message format:
      # 
      # [title](release_url)
      #
      # summary
      - name: Build Slack payload
        id: build_payload
        shell: bash
        env:
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_URL: ${{ inputs.release_url }}
          RELEASE_SUMMARY: ${{ steps.summarize.outputs.summary }}
        run: |
          set -euo pipefail

          payload_path="${RUNNER_TEMP:-/tmp}/slack-post-release-payload.json"
          mkdir -p "$(dirname "$payload_path")"

          jq -n \
            --arg title "$RELEASE_TITLE" \
            --arg release_url "$RELEASE_URL" \
            --arg summary "$RELEASE_SUMMARY" \
            '
              def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
              def trim: gsub("^[[:space:]]+|[[:space:]]+$"; "");
              def truncate($n): if length > $n then .[0:($n - 3)] + "..." else . end;

              ($summary | trim) as $clean_summary |
              {
                text: "\($title): \(if $clean_summary == "" then "Summary not available yet" else $clean_summary end)",
                unfurl_links: false,
                unfurl_media: false,
                blocks: [
                  {
                    type: "section",
                    text: {
                      type: "mrkdwn",
                      text: "*<\($release_url)|\($title | esc)>*"
                    }
                  },
                  {
                    type: "section",
                    text: {
                      type: "mrkdwn",
                      text: (if $clean_summary == "" then "Summary not available yet" else ($clean_summary | esc) end | truncate(1800))
                    }
                  }
                ]
              }
            ' > "$payload_path"

          echo "payload_path=$payload_path" >> "$GITHUB_OUTPUT"

      - name: Resolve Slack bot identity
        id: slack_identity
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.slack_bot_token }}
        run: |
          set -euo pipefail

          auth_response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data-binary "{}" \
              "https://slack.com/api/auth.test"
          )"

          if [ "$(jq -r '.ok // false' <<< "$auth_response")" != "true" ]; then
            echo "::error::Slack auth.test failed: $(jq -r '.error // "unknown_error"' <<< "$auth_response")"
            exit 1
          fi

          bot_user_id="$(jq -r '.user_id // ""' <<< "$auth_response")"
          bot_id="$(jq -r '.bot_id // ""' <<< "$auth_response")"
          if [ -z "$bot_user_id" ] && [ -z "$bot_id" ]; then
            echo "::error::Slack auth.test did not return user_id or bot_id."
            exit 1
          fi

          echo "bot_user_id=$bot_user_id" >> "$GITHUB_OUTPUT"
          echo "bot_id=$bot_id" >> "$GITHUB_OUTPUT"

      - name: Find existing Slack notification
        id: find_slack_notification
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.slack_bot_token }}
          SLACK_CHANNEL_ID: ${{ vars.RELEASE_SUMMARY_SLACK_CHANNEL_ID }}
          RELEASE_URL: ${{ inputs.release_url }}
          SLACK_BOT_USER_ID: ${{ steps.slack_identity.outputs.bot_user_id }}
          SLACK_BOT_ID: ${{ steps.slack_identity.outputs.bot_id }}
        run: |
          set -euo pipefail

          history_request="${RUNNER_TEMP:-/tmp}/slack-post-release-history-request.json"
          jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            '{channel: $channel, limit: 100}' \
            > "$history_request"

          history_response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data-binary "@${history_request}" \
              "https://slack.com/api/conversations.history"
          )"

          if [ "$(jq -r '.ok // false' <<< "$history_response")" != "true" ]; then
            echo "::error::Slack conversations.history failed: $(jq -r '.error // "unknown_error"' <<< "$history_response")"
            exit 1
          fi

          existing_ts="$(
            jq -r \
              --arg release_url "$RELEASE_URL" \
              --arg bot_user_id "$SLACK_BOT_USER_ID" \
              --arg bot_id "$SLACK_BOT_ID" \
              '
              .messages[]?
              | select(
                  (($bot_user_id != "" and .user == $bot_user_id) or
                   ($bot_id != "" and .bot_id == $bot_id))
                )
              | select([.. | strings] | any(contains($release_url)))
              | .ts
            ' <<< "$history_response" | head -n 1
          )"

          echo "message_ts=$existing_ts" >> "$GITHUB_OUTPUT"

      - name: Update Slack notification
        id: update_slack_notification
        if: ${{ steps.find_slack_notification.outputs.message_ts != '' }}
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.slack_bot_token }}
          SLACK_CHANNEL_ID: ${{ vars.RELEASE_SUMMARY_SLACK_CHANNEL_ID }}
          SLACK_MESSAGE_TS: ${{ steps.find_slack_notification.outputs.message_ts }}
          SLACK_PAYLOAD_PATH: ${{ steps.build_payload.outputs.payload_path }}
        run: |
          set -euo pipefail

          if [ -z "$SLACK_PAYLOAD_PATH" ]; then
            echo "::error::Slack payload path was not provided."
            exit 1
          fi

          if [ ! -f "$SLACK_PAYLOAD_PATH" ]; then
            echo "::error::Slack payload file does not exist: $SLACK_PAYLOAD_PATH"
            exit 1
          fi

          update_payload="${RUNNER_TEMP:-/tmp}/slack-post-release-update.json"
          jq \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg ts "$SLACK_MESSAGE_TS" \
            '. + {channel: $channel, ts: $ts}' \
            "$SLACK_PAYLOAD_PATH" > "$update_payload"

          update_response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data-binary "@${update_payload}" \
              "https://slack.com/api/chat.update"
          )"

          if [ "$(jq -r '.ok // false' <<< "$update_response")" != "true" ]; then
            echo "::error::Slack chat.update failed: $(jq -r '.error // "unknown_error"' <<< "$update_response")"
            exit 1
          fi

          echo "message_ts=$(jq -r '.ts' <<< "$update_response")" >> "$GITHUB_OUTPUT"

      - name: Post Slack notification
        id: post_slack_notification
        if: ${{ steps.find_slack_notification.outputs.message_ts == '' }}
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.slack_bot_token }}
          SLACK_CHANNEL_ID: ${{ vars.RELEASE_SUMMARY_SLACK_CHANNEL_ID }}
          SLACK_PAYLOAD_PATH: ${{ steps.build_payload.outputs.payload_path }}
        run: |
          set -euo pipefail

          if [ -z "$SLACK_PAYLOAD_PATH" ]; then
            echo "::error::Slack payload path was not provided."
            exit 1
          fi

          if [ ! -f "$SLACK_PAYLOAD_PATH" ]; then
            echo "::error::Slack payload file does not exist: $SLACK_PAYLOAD_PATH"
            exit 1
          fi

          post_payload="${RUNNER_TEMP:-/tmp}/slack-post-release-post.json"
          jq --arg channel "$SLACK_CHANNEL_ID" '. + {channel: $channel}' "$SLACK_PAYLOAD_PATH" > "$post_payload"

          post_response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data-binary "@${post_payload}" \
              "https://slack.com/api/chat.postMessage"
          )"

          if [ "$(jq -r '.ok // false' <<< "$post_response")" != "true" ]; then
            echo "::error::Slack chat.postMessage failed: $(jq -r '.error // "unknown_error"' <<< "$post_response")"
            exit 1
          fi

          echo "message_ts=$(jq -r '.ts' <<< "$post_response")" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        shell: bash
        env:
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_URL: ${{ inputs.release_url }}
          RELEASE_SUMMARY: ${{ steps.summarize.outputs.summary }}
          SLACK_PAYLOAD_PATH: ${{ steps.build_payload.outputs.payload_path }}
          SLACK_OPERATION: ${{ steps.find_slack_notification.outputs.message_ts != '' && 'updated' || 'posted' }}
          SLACK_MESSAGE_TS: ${{ steps.update_slack_notification.outputs.message_ts || steps.post_slack_notification.outputs.message_ts }}
        run: |
          set -euo pipefail

          if [ -z "${GITHUB_STEP_SUMMARY:-}" ]; then
            exit 0
          fi

          {
            echo "## Slack Post Release"
            echo
            echo "- Title: [${RELEASE_TITLE}](${RELEASE_URL})"
            echo "- Slack action: ${SLACK_OPERATION:-unknown}"
            echo "- Slack message ts: \`${SLACK_MESSAGE_TS:-not available}\`"
            echo "- Payload: \`${SLACK_PAYLOAD_PATH:-not available}\`"
            if [ -n "$RELEASE_SUMMARY" ]; then
              echo
              echo "### Summary"
              echo
              echo "$RELEASE_SUMMARY"
            else
              echo "- Summary: empty"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
